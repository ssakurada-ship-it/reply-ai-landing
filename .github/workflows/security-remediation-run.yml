name: Security remediation run

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  remediate-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Patch React effect lint blockers
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/components/HeroA.tsx")
          content = path.read_text(encoding="utf-8")

          replacements = [
              (
                  """    if (!currentLine) {
                    setDone(true);
                    return;
                  }""".replace("                  ", ""),
                  "    if (!currentLine) return;",
              ),
              (
                  """    if (replyChars >= demo.reply.length) {
                    setPhase(\"done\");
                    return;
                  }
                  const timer = setTimeout(() => setReplyChars((c) => c + 1), TYPING_SPEED);""".replace("                  ", ""),
                  """    if (replyChars >= demo.reply.length) return;
                  const timer = setTimeout(() => {
                    const next = replyChars + 1;
                    setReplyChars(next);
                    if (next >= demo.reply.length) setPhase(\"done\");
                  }, TYPING_SPEED);""".replace("                  ", ""),
              ),
          ]

          for before, after in replacements:
              if after in content:
                  continue
              if before not in content:
                  raise SystemExit("Expected HeroA patch target was not found")
              content = content.replace(before, after, 1)

          path.write_text(content, encoding="utf-8")
          PY

      - name: Harden dependency manifest
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.dependencies ??= {};
          p.devDependencies ??= {};
          delete p.dependencies.shadcn;
          p.devDependencies.shadcn = '4.14.1';
          p.overrides = {
            ...(p.overrides || {}),
            postcss: '8.5.23',
            sharp: '0.35.3'
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE

      - name: Upgrade patched dependencies
        run: |
          npm install --save-exact next@16.2.12 react@19.2.8 react-dom@19.2.8 @base-ui/react@1.6.0
          npm install --save-dev --save-exact eslint-config-next@16.2.12 shadcn@4.14.1
          npm audit fix

      - name: Verify dependency boundaries
        run: |
          node <<'NODE'
          const p = require('./package.json');
          const l = require('./package-lock.json');
          const expected = {
            next: '16.2.12',
            react: '19.2.8',
            'react-dom': '19.2.8',
            '@base-ui/react': '1.6.0'
          };
          for (const [name, version] of Object.entries(expected)) {
            if (p.dependencies[name] !== version) throw new Error(`${name} package.json mismatch`);
            if (l.packages[`node_modules/${name}`]?.version !== version) throw new Error(`${name} lock mismatch`);
          }
          if (p.dependencies.shadcn) throw new Error('shadcn must not be a production dependency');
          if (p.devDependencies.shadcn !== '4.14.1') throw new Error('shadcn dev dependency mismatch');
          if (p.devDependencies['eslint-config-next'] !== '16.2.12') throw new Error('eslint-config-next mismatch');
          if (p.overrides?.postcss !== '8.5.23') throw new Error('postcss override mismatch');
          if (p.overrides?.sharp !== '0.35.3') throw new Error('sharp override mismatch');
          const postcss = Object.entries(l.packages).filter(([path]) => path.endsWith('node_modules/postcss'));
          if (!postcss.length || postcss.some(([, meta]) => meta.version !== '8.5.23')) throw new Error('unsafe postcss resolution');
          const sharp = Object.entries(l.packages).filter(([path]) => path.endsWith('node_modules/sharp'));
          if (!sharp.length || sharp.some(([, meta]) => meta.version !== '0.35.3')) throw new Error('unsafe sharp resolution');
          NODE

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload verified changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-security-remediation
          path: |
            package.json
            package-lock.json
            src/components/HeroA.tsx
          retention-days: 7

      - name: Commit verified remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/components/HeroA.tsx
          if git diff --cached --quiet; then
            echo "No remediation changes to commit"
            exit 0
          fi
          git commit -m "fix(security): upgrade dependencies and close validation blockers"
          git push origin HEAD:${{ github.head_ref }}
