name: Dependency security fix

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/dependency-security-fix.yml

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Patch existing lint blockers
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(path, before, after) {
            let content = fs.readFileSync(path, 'utf8');
            if (content.includes(after)) return;
            if (!content.includes(before)) {
              throw new Error(`Expected patch target not found in ${path}`);
            }
            content = content.replace(before, after);
            fs.writeFileSync(path, content);
          }

          replaceExact(
            'src/components/Footer.tsx',
            'import { XIcon } from "lucide-react";',
            'import Link from "next/link";\nimport { XIcon } from "lucide-react";'
          );
          replaceExact(
            'src/components/Footer.tsx',
            `            <a href="/" className="flex items-center gap-1 font-bold text-xl text-white">
              ReplyAI
              <span className="inline-block w-1.5 h-1.5 rounded-full bg-indigo-500 mb-1" />
            </a>`,
            `            <Link href="/" className="flex items-center gap-1 font-bold text-xl text-white">
              ReplyAI
              <span className="inline-block w-1.5 h-1.5 rounded-full bg-indigo-500 mb-1" />
            </Link>`
          );

          replaceExact(
            'src/components/Navbar.tsx',
            'import { useState } from "react";',
            'import Link from "next/link";\nimport { useState } from "react";'
          );
          replaceExact(
            'src/components/Navbar.tsx',
            `          <a href="/" className="flex items-center gap-1 font-bold text-xl text-slate-900">
            ReplyAI
            <span className="inline-block w-1.5 h-1.5 rounded-full bg-indigo-600 mb-1" />
          </a>`,
            `          <Link href="/" className="flex items-center gap-1 font-bold text-xl text-slate-900">
            ReplyAI
            <span className="inline-block w-1.5 h-1.5 rounded-full bg-indigo-600 mb-1" />
          </Link>`
          );

          replaceExact(
            'src/components/HeroA.tsx',
            `    if (!currentLine) {
      setDone(true);
      return;
    }`,
            '    if (!currentLine) return;'
          );
          replaceExact(
            'src/components/HeroA.tsx',
            `    if (replyChars >= demo.reply.length) {
      setPhase("done");
      return;
    }
    const timer = setTimeout(() => setReplyChars((c) => c + 1), TYPING_SPEED);`,
            `    if (replyChars >= demo.reply.length) return;
    const timer = setTimeout(() => {
      const next = replyChars + 1;
      setReplyChars(next);
      if (next >= demo.reply.length) setPhase("done");
    }, TYPING_SPEED);`
          );
          NODE

      - name: Harden dependency manifest
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.dependencies ??= {};
          p.devDependencies ??= {};
          delete p.dependencies.shadcn;
          p.devDependencies.shadcn = '4.14.1';
          p.overrides = {
            ...(p.overrides || {}),
            postcss: '8.5.23',
            sharp: '0.35.3'
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE

      - name: Upgrade patched framework dependencies
        run: |
          npm install --save-exact next@16.2.12 react@19.2.8 react-dom@19.2.8 @base-ui/react@1.6.0
          npm install --save-dev --save-exact eslint-config-next@16.2.12 shadcn@4.14.1
          npm audit fix

      - name: Verify locked versions and dependency boundaries
        run: |
          node <<'NODE'
          const p = require('./package.json');
          const l = require('./package-lock.json');
          const expected = {
            next: '16.2.12',
            react: '19.2.8',
            'react-dom': '19.2.8',
            '@base-ui/react': '1.6.0'
          };
          for (const [name, version] of Object.entries(expected)) {
            if (p.dependencies[name] !== version) throw new Error(`${name} package.json mismatch`);
            if (l.packages[`node_modules/${name}`]?.version !== version) throw new Error(`${name} lock mismatch`);
          }
          if (p.dependencies.shadcn) throw new Error('shadcn must not be a production dependency');
          if (p.devDependencies.shadcn !== '4.14.1') throw new Error('shadcn dev dependency mismatch');
          if (p.devDependencies['eslint-config-next'] !== '16.2.12') throw new Error('eslint-config-next package.json mismatch');
          if (p.overrides?.postcss !== '8.5.23') throw new Error('postcss override mismatch');
          if (p.overrides?.sharp !== '0.35.3') throw new Error('sharp override mismatch');
          const postcssEntries = Object.entries(l.packages).filter(([path]) => path.endsWith('node_modules/postcss'));
          if (!postcssEntries.length || postcssEntries.some(([, meta]) => meta.version !== '8.5.23')) {
            throw new Error(`unsafe postcss resolution: ${JSON.stringify(postcssEntries)}`);
          }
          const sharpEntries = Object.entries(l.packages).filter(([path]) => path.endsWith('node_modules/sharp'));
          if (!sharpEntries.length || sharpEntries.some(([, meta]) => meta.version !== '0.35.3')) {
            throw new Error(`unsafe sharp resolution: ${JSON.stringify(sharpEntries)}`);
          }
          NODE

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload verified changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-security-fix
          path: |
            package.json
            package-lock.json
            src/components/Footer.tsx
            src/components/Navbar.tsx
            src/components/HeroA.tsx
          retention-days: 7
          overwrite: true

      - name: Commit verified upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/components/Footer.tsx src/components/Navbar.tsx src/components/HeroA.tsx
          if git diff --cached --quiet; then
            echo "No security changes to commit"
            exit 0
          fi
          git commit -m "fix(security): upgrade dependencies and close validation blockers"
          git push origin HEAD:${{ github.head_ref }}
